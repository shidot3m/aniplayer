name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx @biomejs/biome check .
      - run: npx vitest run
      - run: npx --yes aislop scan

  rust:
    name: Rust checks
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Compile all tests
        working-directory: src-tauri
        run: cargo test --locked --no-run

      # test_api needs the live AniLiberty API and test_player needs libmpv-2.dll,
      # so CI compiles them but only executes the hermetic suites.
      - name: Run hermetic tests
        working-directory: src-tauri
        run: cargo test --locked --test test_db --test test_scanner --test test_security_config

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
      - name: JS toolchain guard (Bun only)
        run: |
          # The character-class pattern is deliberate: it matches both legacy
          # registry-client spellings without either appearing literally in
          # this file, so the guard cannot flag its own source.
          rc=0
          matches=$(grep -rnE '\bnp[mx]\b' .github/workflows scripts) || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::JS toolchain guard is misconfigured (grep exit $rc)"
            exit 1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "$matches"
            echo "::error::the JS toolchain is Bun; legacy registry-client commands may not appear in workflows or scripts"
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - name: Type-check app, tests, and build configuration
        run: bun run typecheck
      - name: Biome
        run: bun run lint
      - name: Vitest
        run: bun run test
      - name: aislop quality gate
        run: bunx aislop ci
      - name: Build
        run: bun run build

  rust:
    name: Rust checks
    runs-on: windows-latest
    # A cold Windows build of this graph takes ~13 minutes; the old 15-minute cap
    # killed the job after every step had passed, during the cache save.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - name: Audit dependencies
        working-directory: src-tauri
        run: cargo audit
      - name: Clippy (warnings denied)
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      # test_api needs the live AniLiberty API, so only the hermetic suites are
      # linked and executed here. Clippy above type-checks every test target.
      - name: Run hermetic tests
        working-directory: src-tauri
        run: >-
          cargo test --locked
          --test test_db
          --test test_download_queue
          --test test_hls_playlist
          --test test_player
          --test test_player_command_threading
          --test test_player_ipc
          --test test_player_window_stack
          --test test_security_config
          --test test_startup

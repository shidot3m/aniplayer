[package]
name = "aniplayer"
version = "1.0.0"
description = "High-Performance 4K Anime Player with Anime4K Shaders and AniLiberty API"
authors = ["Aniplayer Team"]
edition = "2021"

[lib]
name = "aniplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
thiserror = "2.0"
tauri-plugin-opener = "2"
rfd = { version = "0.16.1", default-features = false }

[dev-dependencies]
tauri-utils = "2"
